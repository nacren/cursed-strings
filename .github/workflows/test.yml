name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: npm run verify:results
      - run: npm run report
      - run: npm run report:think
      - run: git diff --exit-code -- bench/results/results.md bench/results/results.csv bench/results/thinking.md
